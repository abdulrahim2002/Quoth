name: Feature request
description: Suggest something Quoth could do
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: Describe the task or situation, not only the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How you do it now, or where Quoth gets in the way.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other ways you have tried or considered.
