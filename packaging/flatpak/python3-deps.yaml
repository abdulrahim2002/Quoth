# Runtime PyPI deps. Generated, then trimmed to runtime-only:
#   flatpak-pip-generator --runtime=org.gnome.Sdk//50 --prefer-wheels=numpy --yaml \
#     -o python3-deps loguru numpy sentry-sdk
# - evdev is omitted: the sandbox uses portal shortcuts or manual `quoth --toggle`,
#   and listener.py guards the import.
# - hatchling (the build backend) is build-only; see python3-build-deps.yaml.
# - pycairo comes from the GNOME runtime; patched PyGObject is a separate module.
#   The quoth wheel installs --no-deps.
# sentry-sdk (opt-in crash reports) brings urllib3 and certifi; all three are universal.
# The numpy (cp313) / loguru (universal) wheels are runtime-version-independent (//49 and
# //50 both ship Python 3.13.14), so a runtime bump needs no re-pin here.
name: python3-deps
buildsystem: simple
build-commands: []
modules:
  - name: python3-loguru
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "loguru" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0c/29/0348de65b8cc732daa3e33e67806420b2ae89bdce2b04af740289c5c6c8c/loguru-0.7.3-py3-none-any.whl
        sha256: 31a33c10c8e1e10422bfd431aeb5d351c7cf7fa671e3c4df004162264b28220c
  - name: python3-numpy
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "numpy" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a5/9d/3584b9984ca4c047aea75214ce1a4c4c73d849bd71b604264b7f5653f8a8/numpy-2.4.6-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: a7830bab239b79cda9c08c2da014761cafb48da6150e1da17ac06283f43b6089
        only-arches:
          - x86_64
      - type: file
        url: https://files.pythonhosted.org/packages/bb/c5/7b863a97a91671a0338f4253bd3b5a3d3852f0692dae91711c9f4a10e787/numpy-2.4.6-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 72fbe16c6fac95aedf5937fa873445cec2110be35d8a4e9433d7501fd98dae6b
        only-arches:
