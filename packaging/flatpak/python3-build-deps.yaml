# Build-only Python deps: the PEP 517 backend used to build the quoth wheel with
# `pip install --no-build-isolation` (Flathub builds are offline, so the backend must be
# present, not fetched). `cleanup: ['*']` is module-scoped: flatpak-builder removes every
# file this module installed from the final image, so hatchling & co. never ship at runtime.
# Listed BEFORE the quoth module so it is importable when quoth builds.
# Equivalent: flatpak-pip-generator --runtime=org.gnome.Sdk//50 --build-only --yaml \
#   -o python3-build-deps hatchling   (wheels are universal: version-independent of //49/50).
name: python3-hatchling
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
    --prefix=${FLATPAK_DEST} "hatchling" --no-build-isolation
cleanup:
  - '*'
