name: openvino-npu-runtime
buildsystem: simple
build-commands:
  # The .deb's OpenVINO wheel, unpacked until Quoth builds against its CMake config and
  # vendor_openvino.sh takes the NPU keep-set from it; the manifest cleans it up.
  - install -d /app/opt /app/lib
  - python3 -m zipfile -e openvino.whl /app/opt/openvino
  - echo "e53f2563de9072e9fc36227d4e28aad5bdb7d75d03d43f87436f8f7ab0b98955  npu-driver/intel-level-zero-npu_1.38.0.20260910-34487311128~ubuntu24.04_amd64.deb" | sha256sum -c -
  - echo "472cdce7808e5dd5f9a239f9f3f918f0673fa8ccf93a5e1b45290f4daff41a88  npu-driver/intel-driver-compiler-npu_1.38.0.20260910-34487311128~ubuntu24.04_amd64.deb" | sha256sum -c -
  - install -d npu-root level-zero-root
  - ar p npu-driver/intel-level-zero-npu_1.38.0.20260910-34487311128~ubuntu24.04_amd64.deb data.tar.gz | tar -xzf - -C npu-root
  - ar p npu-driver/intel-driver-compiler-npu_1.38.0.20260910-34487311128~ubuntu24.04_amd64.deb data.tar.gz | tar -xzf - -C npu-root
  - ar p level-zero.deb data.tar.gz | tar -xzf - -C level-zero-root
  # The driver loads its compiler from its own directory. The compiler takes the libtbb
  # that OpenVINO, preloaded from Quoth's lib/openvino, has already loaded.
  - cp -aP npu-root/usr/lib/x86_64-linux-gnu/libze_intel_npu.so* npu-root/usr/lib/x86_64-linux-gnu/libopenvino_intel_npu_compiler*.so /app/lib/
  - cp -aP level-zero-root/usr/lib/x86_64-linux-gnu/libze_loader.so* /app/lib/
  - install -d /app/share/licenses/openvino /app/share/licenses/intel-npu-driver /app/share/licenses/intel-npu-compiler /app/share/licenses/level-zero
  # The wheel's Apache-2.0 LICENSE and its third-party notices, oneTBB's and hwloc's among them.
  - cp -a /app/opt/openvino/openvino-*.dist-info/licenses/. /app/share/licenses/openvino/
  - install -m644 npu-driver-LICENSE.md /app/share/licenses/intel-npu-driver/LICENSE.md
  - install -m644 npu-driver-third-party-programs.txt /app/share/licenses/intel-npu-driver/third-party-programs.txt
  - install -m644 npu-compiler-LICENSE /app/share/licenses/intel-npu-compiler/LICENSE
  - install -m644 level-zero-LICENSE /app/share/licenses/level-zero/LICENSE
